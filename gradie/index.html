<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gradiê</title>
<meta name="description" content="An instrument for performing generative visuals.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23111' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23222'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <script type="module" crossorigin src="./assets/index-BfiregXc.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BMeOKfIl.css">
</head>
<body>

<!-- Three rows: chrome, screen, control surface. The artwork is a bounded
     screen you operate from the outside, not a backdrop the UI sits on. -->
<div id="app">

  <header id="topbar">
    <span class="brand">gradiê</span>
    <span class="sp"></span>
    <button type="button" class="btn" id="btnFreeze" aria-pressed="false" data-i18n="Freeze">Freeze</button>
    <button type="button" class="btn" id="btnPng" data-i18n="PNG">PNG</button>
    <button type="button" class="btn" id="btnClip" data-i18n="Clip">Clip</button>
    <div class="langtog" role="group" data-i18n-aria="Switch language">
      <button type="button" class="langbtn" id="langEn" data-lang="en"
              aria-pressed="true">EN</button>
      <button type="button" class="langbtn" id="langPt" data-lang="pt-BR"
              aria-pressed="false">PT</button>
    </div>
  </header>

  <!-- The bezel. The canvas is the one emissive surface in the composition;
       the matte housing exists to frame it. -->
  <div id="screen">
    <canvas id="stage" data-i18n-aria="Generative visual"></canvas>
  </div>

  <section id="panel" data-i18n-aria="Control surface">

    <div id="panelHead">
      <div id="visualList" class="chips" role="group" data-i18n-aria="Visual"></div>
      <span class="sp"></span>
      <div id="paletteList" class="orbs" role="group" aria-label="Palette"></div>
      <span class="rule"></span>
      <button type="button" class="btn" id="btnRandom" data-i18n="Randomise">Randomise</button>
      <button type="button" class="btn" id="btnReset" data-i18n="Reset">Reset</button>
      <button type="button" class="btn" id="btnCopy" data-i18n="Copy link">Copy link</button>
      <button type="button" id="btnCollapse" class="btn solid" aria-expanded="true"
              aria-controls="panelBody" data-i18n="Hide Controls">Hide Controls</button>
    </div>

    <div id="panelBody">
      <div id="bank">
        <div id="knobRow" class="row" role="group" data-i18n-aria="Knobs"></div>
        <div id="faderRow" class="row" role="group" data-i18n-aria="Faders"></div>
      </div>
      <div id="drawerWrap">
        <div class="tabs" role="tablist" data-i18n-aria="Detail panels">
          <button type="button" class="tab" id="tabParams" role="tab"
                  aria-selected="false" aria-controls="drawer" data-i18n="Parameters">Parameters</button>
          <button type="button" class="tab" id="tabColour" role="tab"
                  aria-selected="false" aria-controls="colour" data-i18n="Colour">Colour</button>
        </div>
        <div id="drawer" role="tabpanel" aria-labelledby="tabParams" hidden></div>
        <div id="colour" role="tabpanel" aria-labelledby="tabColour" hidden></div>
      </div>
    </div>

  </section>

</div>

<div id="toast" role="status" aria-live="polite">
  <span class="toast-label"></span>
  <div class="toast-bar"><i></i></div>
</div>

<noscript>
  <p style="padding:32px;font:15px/1.6 system-ui">gradiê needs JavaScript and WebGL.</p>
</noscript>

</body>
</html>
